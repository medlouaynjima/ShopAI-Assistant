name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: shopassist
          POSTGRES_USER: shopassist
          POSTGRES_PASSWORD: shopassist-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopassist -d shopassist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://shopassist:shopassist-test@localhost:5432/shopassist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: pytest -q tests/test_postgres_integration.py
      - run: docker build -f Dockerfile.api -t shopassist-api:test .
      - name: Validate Compose configuration
        run: printf 'POSTGRES_PASSWORD=shopassist-ci-config\n' > .env && docker compose config --quiet

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: docker build -f Dockerfile.web -t shopassist-web:test .

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the full stack and check readiness
        shell: bash
        run: |
          trap 'docker compose down -v' EXIT
          printf 'POSTGRES_PASSWORD=shopassist-smoke-password\nAUTH_SECRET_KEY=shopassist-smoke-auth-secret-0123456789abcdef\nADMIN_API_KEY=shopassist-smoke-admin-key\n' > .env
          docker compose up -d --build
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/ready >/dev/null \
              && curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              docker compose ps
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
